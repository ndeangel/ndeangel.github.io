user_description: I am currently a postdoctoral researcher in the High Energy Astrophysics and Related Technologies group (HERTAG) at the Institute for Space Astrophysics and Planetology (<b>IAPS</b>) of the <b>Italian National Institute for Astrophysics</b> in Rome, Italy. My research interests lie at the exciting intersection of high-energy astrophysics and space-based instrumentation. One key aspect of my work involves the development of the next-generation Compton polarimeters, such as POLAR-2 and CUSP, aiming to respectively measure the hard X-ray polarization of the prompt emission of Gamma-Ray Bursts (GRBs) and of Solar Flares. I have been extensively involved in various facets of these projects, including the characterization of Silicon Photomultipliers (SiPMs), Multi-Anode Photomultipliers (MAPMTs), or Avalanche PhotoDiodes (APDs), optical characterization and simulation using Geant4, and the implementation of data acquisition systems using ASIC/FPGA-based electronics. Additionally, I contribute to the rigorous space qualification campaigns of POLAR-2, ensuring its reliability and robustness through irradiation, vibration and shock testing, as well as thermal vacuum cycling. I am also actively involved in the mechanical assembly and design of the polarimeter as well as in gamma-ray detector calibration. I am also actively engaged in the data analysis of the POLAR mission, predecessor of POLAR-2. Additionally, I am involved in the development of other future space-based experiments such as PHEMTO (the Polarimetric High Energy Modular Telescope Observatory).
user_title: Postdoctoral researcher in high-energy astrophysics at INAF-IAPS (Rome, Italy)
