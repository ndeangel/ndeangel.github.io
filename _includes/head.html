<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- assign page_title = page.title | default: site.title -%}
  {%- assign page_description = page.description | default: site.description | strip_html | strip_newlines | truncate: 200 -%}
  {%- assign page_url = page.url | replace: 'index.html', '' | absolute_url %}
  <title>{{ page_title | escape }}</title>
  <meta name="description" content="{{ page_description | escape }}">
  <meta name="author" content="{{ site.username | escape }}">
  <meta name="theme-color" content="#1a222c">
  <link rel="canonical" href="{{ page_url }}">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

  <!-- Link previews (LinkedIn, Slack, WhatsApp, X, ...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description" content="{{ page_description | escape }}">
  <meta property="og:url" content="{{ page_url }}">
  <meta property="og:image" content="{{ '/assets/img/og-image.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.username | escape }} - {{ site.tagline | escape }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="{{ '/assets/fonts/montserrat-latin-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
